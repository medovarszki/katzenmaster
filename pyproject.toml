[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "katzenmaster"
dynamic = ["version"]
description = "A tiny pixel-art cat that lives at the bottom of your screen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10"]

[tool.setuptools]
packages = ["katzenmaster"]

[tool.setuptools.dynamic]
version = {attr = "katzenmaster.__version__"}  # single source of truth for the version

[tool.pytest.ini_options]
testpaths = ["tests"]
