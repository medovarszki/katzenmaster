name: build

# Builds a single-file executable for Windows and Linux on every push to main.
# Download them from the run's "Artifacts" section. Pushing a tag like v0.1.0
# also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: katzenmaster-windows-x86_64
            file: dist/katzenmaster-windows-x86_64.exe
          # oldest supported runner -> oldest glibc -> runs on the most distributions
          - os: ubuntu-22.04
            artifact: katzenmaster-linux-x86_64
            file: dist/katzenmaster-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # needed by the tests and bundled into the binary for the xcb platform plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build and smoke-test executable
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
