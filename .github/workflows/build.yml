name: build

# Builds a single-file executable for Windows and Linux on every push to main.
# Download them from the run's "Artifacts" section.
#
# Release: bump katzenmaster/__init__.py, add a "## [x.y.z]" section to CHANGELOG.md,
# commit, then push a tag "vx.y.z". The tag run checks that tag, version and changelog
# agree, builds both executables and publishes them as a GitHub Release (asset names
# carry no version, so .../releases/latest/download/<name> always points to the newest).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: katzenmaster-windows-x86_64
            file: dist/katzenmaster-windows-x86_64.exe
          # oldest supported runner -> oldest glibc -> runs on the most distributions
          - os: ubuntu-22.04
            artifact: katzenmaster-linux-x86_64
            file: dist/katzenmaster-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag, version and changelog (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/release.py check "${{ github.ref_name }}"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # needed by the tests and bundled into the binary for the xcb platform plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build and smoke-test executable
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: python3 packaging/release.py notes "${{ github.ref_name }}" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -l
          test -f katzenmaster-windows-x86_64.exe
          test -f katzenmaster-linux-x86_64.tar.gz
          sha256sum katzenmaster-windows-x86_64.exe katzenmaster-linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: katzenmaster ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/katzenmaster-windows-x86_64.exe
            artifacts/katzenmaster-linux-x86_64.tar.gz
            artifacts/SHA256SUMS.txt
