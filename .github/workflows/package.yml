name: package

# Publishes the files of a GitHub Release to GitHub Packages (ghcr.io) as an OCI
# artifact, so they show up under the repository's "Packages":
#   ghcr.io/<owner>/katzenmaster:<version>   (and :latest for non pre-releases)
# Download with ORAS:  oras pull ghcr.io/<owner>/katzenmaster:latest
#
# Called by build.yml after every release; run it by hand ("Run workflow", with the
# tag) to publish an existing release. The files are taken from the release itself and
# verified against its SHA256SUMS.txt, so the package holds exactly the released files.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Kiadás tagje, pl. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  oci:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}  # via env, never pasted into the scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi

      - name: Download the release files
        run: |
          mkdir files
          cd files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'katzenmaster-*' --pattern SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test -f katzenmaster-windows-x86_64.exe
          test -f katzenmaster-linux-x86_64.tar.gz
          ls -l

      - uses: oras-project/setup-oras@v1

      - name: Push to ghcr.io
        working-directory: files
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$image:$version" \
            --artifact-type application/vnd.katzenmaster.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.title=katzenmaster" \
            --annotation "org.opencontainers.image.description=A pixel-art cat that lives at the bottom of your screen. Windows exe and Linux tar.gz; download with: oras pull $image:$version" \
            katzenmaster-windows-x86_64.exe:application/vnd.microsoft.portable-executable \
            katzenmaster-linux-x86_64.tar.gz:application/gzip \
            SHA256SUMS.txt:text/plain
          if [[ "$TAG" != *-* ]]; then
            oras tag "$image:$version" latest
          fi
          echo "published $image:$version" >> "$GITHUB_STEP_SUMMARY"
